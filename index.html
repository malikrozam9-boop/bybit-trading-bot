<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bybit Auto Trading Bot</title>
    <!-- TradingView Lightweight Charts Library -->
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        body { background: #121212; color: white; font-family: Arial; padding: 15px; text-align: center; margin: 0; }
        h2 { font-size: 20px; margin-bottom: 10px; }
        #chart-container { width: 100%; height: 350px; margin: 10px auto; border-radius: 8px; overflow: hidden; }
        .panel { background: #1e1e1e; padding: 15px; border-radius: 8px; margin-top: 15px; display: inline-block; width: 100%; max-width: 400px; box-sizing: border-box; }
        select, input, button { width: 100%; padding: 12px; margin: 8px 0; font-size: 16px; border-radius: 6px; border: 1px solid #333; background: #2a2a2a; color: white; box-sizing: border-box; }
        button { cursor: pointer; background: #28a745; font-weight: bold; border: none; }
    </style>
</head>
<body>

    <h2>Bybit Spot Bot Dashboard</h2>
    
    <!-- Lightweight Chart Box -->
    <div id="chart-container"></div>

    <!-- Controls Panel -->
    <div class="panel">
        <label>Select Coin:</label>
        <select id="coinSelect">
            <option value="BTCUSDT">BTC/USDT</option>
            <option value="SOLUSDT">SOL/USDT</option>
        </select>
        
        <label>Investment (USDT):</label>
        <input type="number" id="amountInput" value="20">
        
        <button id="botToggleBtn" onclick="toggleBot()">Bot: OFF</button>
    </div>

    <script>
        // Chart Initialization
        const chart = LightweightCharts.createChart(document.getElementById('chart-container'), {
            layout: { background: { color: '#131722' }, textColor: '#d1d4dc' },
            grid: { vertLines: { color: '#2b2b43' }, horzLines: { color: '#2b2b43' } },
            timeScale: { borderColor: '#485ceb' }
        });
        const candleSeries = chart.addCandlestickSeries();

        // Bybit Public API se live candles fetch karke chart par lagana
        async function loadChartData() {
            try {
                const response = await fetch('https://api.bybit.com/v5/market/kline?category=spot&symbol=BTCUSDT&interval=15&limit=100');
                const data = await response.json();
                if(data.retCode === 0) {
                    const formattedData = data.result.list.reverse().map(item => ({
                        time: parseInt(item[0]) / 1000,
                        open: parseFloat(item[1]),
                        high: parseFloat(item[2]),
                        low: parseFloat(item[3]),
                        close: parseFloat(item[4]),
                    }));
                    candleSeries.setData(formattedData);
                }
            } catch(e) { console.log("Error loading chart", e); }
        }
        loadChartData();

        // Bot ON/OFF Toggle Function
        let isBotOn = false;
        function toggleBot() {
            isBotOn = !isBotOn;
            const btn = document.getElementById('botToggleBtn');
            if(isBotOn) {
                btn.innerText = "Bot: ON (Active)";
                btn.style.background = "#dc3545";
                alert("Bot Activated!");
            } else {
                btn.innerText = "Bot: OFF";
                btn.style.background = "#28a745";
                alert("Bot Deactivated!");
            }
        }
    </script>
</body>
</html>
